# SITE SETUP
# Guide: https://wowchemy.com/docs/getting-started/
# Documentation: https://wowchemy.com/docs/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance (customize the theme from data/themes)
appearance:
  theme_day: light
  theme_night: persodark
  font: custom_font
  font_size: M

# SEO

marketing:
  seo:
    site_type: Person
    description: 'Cyprien Bone, PhD researcher in generative modelling for materials at UCL'

# Site header

header:
  navbar:
    enable: true
    align: l
    show_logo: true
    show_language: false
    show_day_night: true
    show_search: false
    highlight_active_link: true

# Site footer

footer:
  copyright:
    notice: '© {year} Cyprien Bone. Organisation logos belong to their owners.'
    license:
      enable: false

# Localization

locale:
  date_format: 'Jan 2006'
  time_format: '3:04 PM'
  address_format: en-us

# Site features

features:
  syntax_highlighter:
    enable: false
  math:
    enable: false
  privacy_pack:
    enable: false
  repository:
    url: 'https://github.com/C-Bone-UCL/C-Bone-UCL.github.io'
    content_dir: content
    branch: main
  avatar:
    gravatar: false
    shape: circle
  search:
    provider: ''

# Extensions

extensions:
  academicons:
    enable: true
