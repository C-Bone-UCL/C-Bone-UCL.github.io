{{/* Tutorials & Workshops: a grid of link cards (content/home/tutorials.md). */}}
{{ $page := .page }}
{{ $columns := $page.Params.design.columns | default "2" }}

<div class="col-12 {{ if eq $columns "2" }}col-lg-8{{ end }}">
  {{ with $page.Content }}{{ . }}{{ end }}

  <div class="tutorial-grid">
    {{ range $page.Params.items }}
    <a class="tutorial-card" href="{{ .url }}" target="_blank" rel="noopener">
      <span class="tutorial-title">{{ .title }}<i class="fas fa-arrow-right tutorial-arrow" aria-hidden="true"></i></span>
      <span class="tutorial-where">{{ .where }}</span>
      <span class="tutorial-text">{{ .text | markdownify }}</span>
    </a>
    {{ end }}
  </div>
</div>
