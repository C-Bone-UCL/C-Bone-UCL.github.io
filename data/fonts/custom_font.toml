# Font style metadata
name = "Pixel headings"

# Pixel font for the nav; assets/scss/custom.scss applies it to section titles, the name and card titles.
# Long page titles stay in the system font so they read easily.
google_fonts = "family=Press+Start+2P"

# Font families
heading_font = "-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"
body_font = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
nav_font = "Press Start 2P"
mono_font = "'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace"
